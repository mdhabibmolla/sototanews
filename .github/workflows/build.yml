name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project files
        run: |
          set -e
          P=proj
          mkdir -p $P/app/src/main/java/com/sotota/panel $P/app/src/main/res/mipmap-xxxhdpi $P/app/src/main/res/values

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'SototaPanel'
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sotota.panel'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.sotota.panel'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">সততা প্যানেল</string>
          </resources>
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/sotota/panel/MainActivity.java <<'EOF'
          package com.sotota.panel;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ConsoleMessage;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;
          import java.util.Collections;

          public class MainActivity extends Activity {
              static final String START_URL = "https://sototanews.gamer.free/admin/panel/login/8/1/2/9/2/";
              static final String HOST = "sototanews.gamer.free";
              static final int FILE_REQ = 1001;

              WebView web;
              ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);

                  // Chrome-er moto user-agent ("; wv" ar "Version/x.x" bad)
                  String ua = s.getUserAgentString().replace("; wv", "").replaceAll("Version/[0-9.]+ ", "");
                  s.setUserAgentString(ua);

                  // X-Requested-With (app-er package-er naam) header pathano bondho
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                      WebSettingsCompat.setRequestedWithHeaderOriginAllowList(s, Collections.<String>emptySet());
                  }

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (ActivityNotFoundException e) { }
                          return true;
                      }

                      @Override
                      public void onReceivedHttpError(WebView v, WebResourceRequest r, WebResourceResponse e) {
                          // Debug: je request-e HTTP error ashe tar code ar path dekhay
                          Toast.makeText(MainActivity.this, "HTTP " + e.getStatusCode() + " " + r.getUrl().getPath(), Toast.LENGTH_LONG).show();
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          // Debug: network error (je request fail holo tar host/path)
                          Toast.makeText(MainActivity.this, "NET " + e.getDescription() + " " + r.getUrl().getHost() + r.getUrl().getPath(), Toast.LENGTH_LONG).show();
                      }
                  });

                  // Photo/file upload
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage m) {
                          // Debug: JavaScript error screen-e dekhay
                          if (m.messageLevel() == ConsoleMessage.MessageLevel.ERROR) {
                              Toast.makeText(MainActivity.this, "JS: " + m.message(), Toast.LENGTH_LONG).show();
                          }
                          return false;
                      }

                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(p.createIntent(), FILE_REQ);
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (saved == null) web.loadUrl(START_URL); else web.restoreState(saved);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      filePathCallback = null;
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

